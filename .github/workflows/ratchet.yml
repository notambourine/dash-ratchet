name: Dash ratchet

# Callable job for the unicode-dash gate: dashes may only ever decrease. The
# caller owns the pull_request trigger and its branch list; this file owns the
# runner tier, the checkout, and the timeout.

on:
  workflow_call:
    inputs:
      exclude:
        description: Paths held out of the rule, one git pathspec per line.
        type: string
        default: ""
      force-zero:
        description: >-
          Require zero dashes in the checkout instead of ratcheting a count
          down. Drops the checkout to depth 1.
        type: boolean
        default: false
      exclude-defaults:
        description: >-
          Apply the built-in hold-out list (lockfiles, vendored trees, agent
          context, upstream licenses). Set false to gate those paths too.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  dashes:
    name: Unicode dashes
    # ubuntu-slim runs unprivileged, so harden-runner cannot load here. The
    # gate needs only bash, git, and perl, all on slim's image.
    runs-on: ubuntu-slim
    timeout-minutes: 5 # slim terminates any job at 15
    steps:
      # 2, not 0: HEAD is refs/pull/N/merge and HEAD^1 is the base tip, so
      # depth 2 carries both sides of the diff and both trees to count.
      # force-zero reads one tree and no diff, so it needs only depth 1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.force-zero && 1 || 2 }}
          persist-credentials: false
      # job.workflow_sha is the ref the caller pinned THIS file to, so the
      # action code below always matches this workflow revision. Not on GHES.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .dash-ratchet
          persist-credentials: false
      - uses: ./.dash-ratchet
        with:
          exclude: ${{ inputs.exclude }}
          exclude-defaults: ${{ inputs.exclude-defaults }}
          force-zero: ${{ inputs.force-zero }}
