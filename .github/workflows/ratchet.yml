name: Dash ratchet

on:
  workflow_call:
    inputs:
      exclude:
        description: Paths held out of the rule, one git pathspec per line.
        type: string
        default: ""
      force-zero:
        description: >-
          Require zero dashes in the checkout instead of ratcheting a count
          down. Drops the checkout to depth 1.
        type: boolean
        default: false
      exclude-defaults:
        description: >-
          Apply the built-in hold-out list (lockfiles, vendored trees, agent
          context, upstream licenses). Set false to gate those paths too.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  dashes:
    name: Unicode dashes
    # Slim is unprivileged, so harden-runner cannot load here.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # A merge ref's first parent supplies the base without fetching history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.force-zero && 1 || 2 }}
          persist-credentials: false
      # job.workflow_sha is the ref the caller pinned THIS file to, so the
      # action code below always matches this workflow revision. Not on GHES.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .dash-ratchet
          persist-credentials: false
      - uses: ./.dash-ratchet
        with:
          exclude: ${{ inputs.exclude }}
          exclude-defaults: ${{ inputs.exclude-defaults }}
          force-zero: ${{ inputs.force-zero }}
