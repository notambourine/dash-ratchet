name: dash-ratchet
description: >-
  Diff-scoped unicode-dash gate for pull requests: no dash on a line the PR
  adds, and the repo-wide total may only fall.
branding:
  icon: minus
  color: gray-dark
inputs:
  base-ref:
    description: Base branch to diff against, without the origin/ prefix.
    default: ${{ github.base_ref }}
  exclude:
    description: Directories held out of the rule, one per line.
    default: ""
  marker:
    description: A line that carries this marker keeps its dash.
    default: dash-ok
runs:
  using: composite
  steps:
    # The caller's checkout must use fetch-depth 0: the gate diffs against
    # origin/<base-ref> and counts dashes on that side too.
    - shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        DASH_EXCLUDE: ${{ inputs.exclude }}
        DASH_MARKER: ${{ inputs.marker }}
      run: '"${GITHUB_ACTION_PATH}/scripts/check-dashes.sh" "origin/${BASE_REF}"'
