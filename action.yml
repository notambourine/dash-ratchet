name: dash-ratchet
description: >-
  Diff-scoped unicode-dash gate for pull requests: no dash on a line the PR
  adds, and the repo-wide total may only fall.
branding:
  icon: minus
  color: gray-dark
inputs:
  base-ref:
    description: >-
      Override the base branch, without the origin/ prefix. Leave empty to
      resolve it from the event, which is what allows a shallow checkout.
    default: ""
  exclude:
    description: Directories held out of the rule, one per line.
    default: ""
  marker:
    description: A line that carries this marker keeps its dash.
    default: dash-ok
runs:
  using: composite
  steps:
    # Unset base-ref is the fast path: the script reads refs/pull/N/merge and
    # takes HEAD^1, which a `fetch-depth: 2` checkout already carries. Setting
    # base-ref names an ordinary branch instead, and that one needs the base
    # fetched - fetch-depth 0, or a fetch of that branch.
    - shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        DASH_EXCLUDE: ${{ inputs.exclude }}
        DASH_MARKER: ${{ inputs.marker }}
      run: |
        if [ -n "${BASE_REF}" ]; then
          "${GITHUB_ACTION_PATH}/scripts/check-dashes.sh" "origin/${BASE_REF}"
        else
          "${GITHUB_ACTION_PATH}/scripts/check-dashes.sh"
        fi
